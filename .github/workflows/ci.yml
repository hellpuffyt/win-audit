name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Pester and PSScriptAnalyzer (windows-latest)"
    runs-on: windows-latest

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Install Pester and PSScriptAnalyzer"
        shell: powershell
        run: |
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      - name: "Run PSScriptAnalyzer"
        shell: powershell
        run: |
          Import-Module PSScriptAnalyzer
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer reported $($results.Count) warning(s)."
          }
          Write-Host "PSScriptAnalyzer: no findings."

      - name: "Import module"
        shell: powershell
        run: |
          Import-Module .\WinAudit.psd1 -Force
          Get-Command -Module WinAudit

      - name: "Run Pester tests"
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $config

      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: testResults.xml
